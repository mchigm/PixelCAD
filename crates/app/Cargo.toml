[package]
name = "pixelcad-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Slint desktop shell for PixelCAD."
build = "build.rs"

[[bin]]
name = "pixelcad-app"
path = "src/main.rs"

[dependencies]
pixelcad-core = { path = "../core" }
slint = "1.8"

[build-dependencies]
slint-build = "1.8"

[dev-dependencies]
i-slint-backend-testing = "1.8"
