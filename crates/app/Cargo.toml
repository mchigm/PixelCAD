[package]
name = "pixelcad-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Slint desktop shell for PixelCAD."
build = "build.rs"

[[bin]]
name = "pixelcad-app"
path = "src/main.rs"

[dependencies]
pixelcad-core = { path = "../core" }
slint = "1.8"
# Settings persistence. `directories` resolves the per-OS config location so
# the shell does not hard-code `~/.config`, which is wrong on macOS.
directories = "5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[build-dependencies]
slint-build = "1.8"

[dev-dependencies]
i-slint-backend-testing = "1.8"
tempfile = "3"
